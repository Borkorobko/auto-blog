name: Finalize AdSense quality cleanup

on:
  push:
    branches:
      - adsense-low-value-cleanup

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: adsense-low-value-cleanup
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Finalize content cleanup
        run: python scripts/finalize_adsense_cleanup.py

      - name: Commit final cleanup results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Finalize AdSense content cleanup" || echo "No final cleanup changes to commit"
          git push origin HEAD:adsense-low-value-cleanup
