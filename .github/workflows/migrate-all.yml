name: Migrate All Old Articles

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  migrate-all:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preflight dry-run for all articles
        shell: bash
        run: |
          set -o pipefail
          python scripts/migrate_old_articles.py --all --dry-run | tee migration-dry-run.txt
          grep -q "Errors: 0" migration-dry-run.txt

      - name: Migrate all old articles
        run: python scripts/migrate_old_articles.py --all

      - name: Show migration summary
        run: |
          echo "Changed files:"
          git status --short

      - name: Commit migrated articles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts images
          git commit -m "Migrate old articles to new FTL design" || echo "No changes to commit"
          git push origin HEAD:main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
