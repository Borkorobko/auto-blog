name: Verify AdSense cleanup

on:
  push:
    branches:
      - adsense-low-value-cleanup

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: adsense-low-value-cleanup
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Polish and verify cleanup
        run: python scripts/post_cleanup_polish.py

      - name: Commit verified cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Polish and verify AdSense cleanup" || echo "No verification changes to commit"
          git push origin HEAD:adsense-low-value-cleanup
