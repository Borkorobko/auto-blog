name: Auto Football Site

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * 1,4"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create article and update site
        run: |
          set -e
          mkdir -p posts

          KEYWORD=$(shuf -n 1 keywords.txt)
          SLUG=$(echo "$KEYWORD" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9' '-')
          SLUG=$(echo "$SLUG" | sed 's/^-//; s/-$//')
          FILE="posts/$SLUG.html"

         
            cat > "$FILE" <<EOF
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>$KEYWORD | Football Fitness Training</title>
            <meta name="description" content="Practical football guide for $KEYWORD.">
            <link rel="stylesheet" href="../style.css">
          </head>
          <body>
            <p><a href="../index.html">← Football Fitness Training</a> · <a href="index.html">All articles</a></p>

            <h1>$KEYWORD</h1>

            <h2>Overview</h2>
            <p>This football guide explains $KEYWORD in a practical way. Use the advice according to your current fitness, playing position and training schedule.</p>

            <h2>Getting started</h2>
            <p>Start with a realistic plan. Train consistently, increase difficulty gradually and leave enough time for recovery.</p>

            <h2>Practical drills and actions</h2>
            <ul>
              <li>Warm up for 10 to 15 minutes before hard training.</li>
              <li>Focus on good technique before increasing speed or volume.</li>
              <li>Use two or three focused sessions per week.</li>
              <li>Track fatigue and reduce intensity when needed.</li>
            </ul>

            <h2>Simple weekly plan</h2>
            <ul>
              <li>Day 1: Technical work and speed.</li>
              <li>Day 2: Strength or conditioning.</li>
              <li>Day 3: Recovery, mobility or light ball work.</li>
            </ul>

            <h2>Common mistakes</h2>
            <ul>
              <li>Increasing training volume too quickly.</li>
              <li>Skipping warm-ups.</li>
              <li>Training hard every day without recovery.</li>
              <li>Ignoring pain or unusual fatigue.</li>
            </ul>

            <h2>Useful next step</h2>
            <p>Use this guide as a starting point and browse the <a href="index.html">full article list</a> for related football topics.</p>

            <h2>Disclosure</h2>
            <p>This site may earn a commission from qualifying purchases through some links.</p>
          </body>
          </html>
          EOF
          

          {
            echo '<!doctype html>'
            echo '<html lang="en"><head><meta charset="utf-8">'
            echo '<meta name="viewport" content="width=device-width, initial-scale=1">'
            echo '<title>Football Training Articles</title></head><body>'
            echo '<h1>Football Training Articles</h1>'
            echo '<p><a href="../index.html">← Home</a></p><ul>'
            for f in $(find posts -maxdepth 1 -type f -name "*.html" ! -name "index.html" | sort); do
              slug=$(basename "$f" .html)
              title=$(echo "$slug" | tr "-" " ")
              echo "<li><a href=\"$slug.html\">$title</a></li>"
            done
            echo '</ul></body></html>'
          } > posts/index.html

          {
            echo '<!doctype html>'
            echo '<html lang="en"><head><meta charset="utf-8">'
            echo '<meta name="viewport" content="width=device-width, initial-scale=1">'
            echo '<title>Football Fitness Training</title>'
            echo '<meta name="description" content="Football training, recovery, conditioning and equipment guides.">'
            echo '</head><body>'
            echo '<h1>Football Fitness Training</h1>'
            echo '<p>Practical football training, recovery, conditioning and equipment guides.</p>'
            echo '<h2>Latest articles</h2><ul>'
            find posts -maxdepth 1 -type f -name "*.html" ! -name "index.html" -printf "%T@ %p\n" | sort -nr | head -10 | cut -d" " -f2- | while read -r f; do
              slug=$(basename "$f" .html)
              title=$(echo "$slug" | tr "-" " ")
              echo "<li><a href=\"posts/$slug.html\">$title</a></li>"
            done
            echo '</ul><p><a href="posts/index.html">View all articles</a></p>'
            echo '<p><small>This site may earn a commission from qualifying purchases through some links.</small></p>'
            echo '</body></html>'
          } > index.html

          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
            echo '  <url><loc>https://borkorobko.github.io/auto-blog/</loc></url>'
            echo '  <url><loc>https://borkorobko.github.io/auto-blog/posts/index.html</loc></url>'
            for f in $(find posts -maxdepth 1 -type f -name "*.html" ! -name "index.html" | sort); do
              slug=$(basename "$f" .html)
              echo "  <url><loc>https://borkorobko.github.io/auto-blog/posts/$slug.html</loc></url>"
            done
            echo '</urlset>'
          } > sitemap.xml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts index.html sitemap.xml style.css
          git commit -m "Create football guide and update site" || exit 0
          git push
