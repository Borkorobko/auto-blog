name: Auto Football Site

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * 1,4"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create better article and update site
        run: |
          set -e
          mkdir -p posts

          KEYWORD=$(shuf -n 1 keywords.txt)
          SLUG=$(echo "$KEYWORD" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9' '-')
          SLUG=$(echo "$SLUG" | sed 's/^-//; s/-$//')
          FILE="posts/$SLUG.html"

          if echo "$KEYWORD" | grep -qi "boots"; then
            CATEGORY="Football boots guide"
            SECTION1="Fit, surface and comfort matter more than brand name. Players should choose boots based on pitch type, foot shape, playing position and budget."
            SECTION2="Look for the correct soleplate, enough lockdown, comfortable upper material and a return policy in case the fit is wrong."
            TIPS="<li>Wide feet usually need softer uppers or wider lasts.</li><li>Artificial grass needs AG or turf-friendly studs.</li><li>Speed players often prefer lighter boots, but comfort still matters.</li>"
          elif echo "$KEYWORD" | grep -qi "water bottle\|equipment\|cones\|ladder\|bands\|rebounder\|backpack\|gloves\|guards\|socks\|football for training"; then
            CATEGORY="Football equipment guide"
            SECTION1="Good football equipment should be durable, easy to use and suitable for regular training. The best option depends on age, training frequency and budget."
            SECTION2="Check material quality, size, portability, cleaning, storage and whether the product solves a real training problem."
            TIPS="<li>Choose practical gear over flashy design.</li><li>Prefer equipment that can be used in many drills.</li><li>For team training, durability matters more than premium branding.</li>"
          elif echo "$KEYWORD" | grep -qi "protein\|creatine\|nutrition\|eat\|hydration\|supplements"; then
            CATEGORY="Football nutrition guide"
            SECTION1="Nutrition supports energy, recovery and training quality. Football players should focus on normal food first, then consider supplements only when basics are consistent."
            SECTION2="Before buying supplements, look at diet, sleep, hydration and match schedule. Supplements cannot replace proper meals."
            TIPS="<li>Eat carbohydrates before hard sessions or matches.</li><li>Include protein after training to support recovery.</li><li>Drink water regularly instead of waiting until you feel thirsty.</li>"
          else
            CATEGORY="Football training guide"
            SECTION1="Football training should improve match performance, not just make a player tired. Speed, stamina, strength, agility and recovery should be trained with a clear plan."
            SECTION2="Start with simple drills, increase intensity gradually and track how your body feels after each session."
            TIPS="<li>Warm up before every hard session.</li><li>Train speed when fresh, not exhausted.</li><li>Use rest days to avoid overuse injuries.</li>"
          fi

          cat > "$FILE" <<EOF
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>$KEYWORD | Football Fitness Training</title>
            <meta name="description" content="$CATEGORY about $KEYWORD for football players.">
          </head>
          <body>
            <header>
              <p><a href="../index.html">← Football Fitness Training</a> · <a href="index.html">All articles</a></p>
            </header>

            <main>
              <article>
                <h1>$KEYWORD</h1>

                <p>This $CATEGORY explains what football players should consider when researching <strong>$KEYWORD</strong>.</p>

                <h2>Why this matters</h2>
                <p>$SECTION1</p>

                <h2>What to look for</h2>
                <p>$SECTION2</p>

                <h2>Practical tips</h2>
                <ul>
                  $TIPS
                </ul>

                <h2>Common mistakes</h2>
                <ul>
                  <li>Choosing based only on price or brand.</li>
                  <li>Ignoring comfort, recovery or long-term use.</li>
                  <li>Copying professional players without considering personal needs.</li>
                </ul>

                <h2>Recommended next step</h2>
                <p>Compare several options, read real reviews and choose based on your level, position and budget.</p>

                <h2>Disclosure</h2>
                <p>This site may earn a commission from qualifying purchases through some links.</p>
              </article>
            </main>
          </body>
          </html>
          EOF

          {
            echo '<!doctype html>'
            echo '<html lang="en"><head><meta charset="utf-8">'
            echo '<meta name="viewport" content="width=device-width, initial-scale=1">'
            echo '<title>Football Training Articles</title></head><body>'
            echo '<h1>Football Training Articles</h1>'
            echo '<p><a href="../index.html">← Home</a></p><ul>'
            for f in $(find posts -maxdepth 1 -type f -name '*.html' ! -name 'index.html' | sort); do
              slug=$(basename "$f" .html)
              title=$(echo "$slug" | tr '-' ' ')
              echo "<li><a href=\"$slug.html\">$title</a></li>"
            done
            echo '</ul></body></html>'
          } > posts/index.html

          {
            echo '<!doctype html>'
            echo '<html lang="en"><head><meta charset="utf-8">'
            echo '<meta name="viewport" content="width=device-width, initial-scale=1">'
            echo '<title>Football Fitness Training</title>'
            echo '<meta name="description" content="Football training, recovery, conditioning and equipment guides.">'
            echo '</head><body>'
            echo '<h1>Football Fitness Training</h1>'
            echo '<p>Practical football training, recovery, conditioning and equipment guides.</p>'
            echo '<h2>Latest articles</h2><ul>'
            find posts -maxdepth 1 -type f -name '*.html' ! -name 'index.html' -printf '%T@ %p\n' | sort -nr | head -10 | cut -d' ' -f2- | while read -r f; do
              slug=$(basename "$f" .html)
              title=$(echo "$slug" | tr '-' ' ')
              echo "<li><a href=\"posts/$slug.html\">$title</a></li>"
            done
            echo '</ul><p><a href="posts/index.html">View all articles</a></p>'
            echo '<p><small>This site may earn a commission from qualifying purchases through some links.</small></p>'
            echo '</body></html>'
          } > index.html

          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
            echo '  <url><loc>https://borkorobko.github.io/auto-blog/</loc></url>'
            echo '  <url><loc>https://borkorobko.github.io/auto-blog/posts/index.html</loc></url>'
            for f in $(find posts -maxdepth 1 -type f -name '*.html' ! -name 'index.html' | sort); do
              slug=$(basename "$f" .html)
              echo "  <url><loc>https://borkorobko.github.io/auto-blog/posts/$slug.html</loc></url>"
            done
            echo '</urlset>'
          } > sitemap.xml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts index.html sitemap.xml
          git commit -m "Improve article quality and update site" || exit 0
          git push
