name: Auto Football Site

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * 1,4"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip openai

      - name: Generate site
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/pre_generation_cleanup.py
          python scripts/replenish_keywords.py
          python scripts/generate.py
          python scripts/post_generate_quality_v2.py
          python scripts/repair_football_context.py
          python scripts/seo_refresh_existing.py
          python scripts/seo_internal_links.py
          python scripts/pre_generation_cleanup.py

      - name: Collect Search Console feedback
        env:
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
          GSC_SITE_PROPERTY: sc-domain:footballtraininglab.com
        run: python scripts/gsc_feedback.py

      - name: Queue one GSC-derived content topic
        run: python scripts/gsc_topic_discovery.py

      - name: Measure prior GSC optimizations
        env:
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
          GSC_SITE_PROPERTY: sc-domain:footballtraininglab.com
        run: python scripts/gsc_optimization_measure.py

      - name: Apply measured-outcome SEO precheck
        run: python scripts/gsc_optimizer_precheck.py

      - name: Optimize one GSC opportunity
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/gsc_seo_optimizer.py

      - name: Apply SEO claim guardrails
        run: python scripts/seo_claim_guardrails.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Generate AI football article and update site" || echo "No changes to commit"
          git push

      - name: Clean runtime Python cache
        run: |
          find . -type d -name "__pycache__" -prune -exec rm -rf {} +
          find . -type f \( -name "*.pyc" -o -name "*.pyo" \) -delete

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
