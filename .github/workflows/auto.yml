name: Auto Football Site

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * 1,4"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create quality article and update site
        run: |
          python3 <<'PY'
          from pathlib import Path
          import random, re, html, time

          SITE = "https://borkorobko.github.io/auto-blog"
          posts = Path("posts")
          posts.mkdir(exist_ok=True)

          keywords = [k.strip() for k in Path("keywords.txt").read_text().splitlines() if k.strip()]
          keyword = random.choice(keywords)

          def slugify(s):
              return re.sub(r"-+", "-", re.sub(r"[^a-z0-9]+", "-", s.lower())).strip("-")

          slug = slugify(keyword)
          file = posts / f"{slug}.html"
          kw = html.escape(keyword)

          def category(k):
              k = k.lower()
              if any(x in k for x in ["boot", "shin", "glove", "bottle", "cones", "ladder", "bands", "backpack", "equipment", "socks", "rebounder"]):
                  return "equipment"
              if any(x in k for x in ["protein", "creatine", "nutrition", "eat", "hydration", "supplements"]):
                  return "nutrition"
              if any(x in k for x in ["recovery", "stretching"]):
                  return "recovery"
              if any(x in k for x in ["speed", "faster", "agility", "drills"]):
                  return "speed"
              if any(x in k for x in ["strength", "leg workout", "core workout", "gym workout", "plyometric"]):
                  return "strength"
              return "training"

          c = category(keyword)

          templates = {
              "speed": f"""
          <h2>Why speed matters</h2>
          <p>Speed training helps football players accelerate faster, react quicker and change direction more confidently during matches.</p>
          <h2>Warm-up</h2>
          <ul><li>5 minutes light jog</li><li>Leg swings and hip mobility</li><li>3 short accelerations</li></ul>
          <h2>Best drills</h2>
          <ul><li>10 metre accelerations: 6 reps</li><li>20 metre sprints: 4 reps</li><li>Shuttle runs: 3 sets</li><li>Cone change-of-direction drill: 4 rounds</li></ul>
          <h2>Weekly plan</h2>
          <p>Do speed work twice per week with at least 48 hours between hard sessions.</p>
          """,
              "strength": f"""
          <h2>Why strength matters</h2>
          <p>Strength helps footballers sprint harder, hold balance in duels and reduce fatigue during matches.</p>
          <h2>Best exercises</h2>
          <ul><li>Squats or goblet squats</li><li>Lunges</li><li>Romanian deadlifts</li><li>Planks</li><li>Calf raises</li></ul>
          <h2>Sets and reps</h2>
          <p>Start with 3 sets of 8 to 12 reps. Focus on clean movement before adding weight.</p>
          <h2>Weekly routine</h2>
          <p>Train strength 2 times per week, ideally away from match day.</p>
          """,
              "equipment": f"""
          <h2>Buying guide</h2>
          <p>When choosing {kw}, focus on comfort, durability, price and how often you will actually use it.</p>
          <h2>What to look for</h2>
          <ul><li>Durable material</li><li>Easy cleaning</li><li>Good value for money</li><li>Suitable size for football training</li></ul>
          <h2>Common mistakes</h2>
          <ul><li>Buying only because of brand name</li><li>Ignoring return policy</li><li>Choosing style over practical use</li></ul>
          <h2>Maintenance</h2>
          <p>Clean equipment after training and store it dry so it lasts longer.</p>
          """,
              "nutrition": f"""
          <h2>Why nutrition matters</h2>
          <p>Good nutrition helps football players train with energy and recover after matches or hard sessions.</p>
          <h2>Before training</h2>
          <p>Eat carbohydrates 2 to 3 hours before training. Keep the meal simple and familiar.</p>
          <h2>After training</h2>
          <p>Combine protein, carbohydrates and water to support recovery.</p>
          <h2>Common mistakes</h2>
          <ul><li>Skipping meals before training</li><li>Relying only on supplements</li><li>Trying new foods on match day</li></ul>
          """,
              "recovery": f"""
          <h2>Why recovery matters</h2>
          <p>Recovery allows football players to train consistently without building too much fatigue.</p>
          <h2>Best recovery methods</h2>
          <ul><li>Sleep 7 to 9 hours</li><li>Hydrate properly</li><li>Light stretching</li><li>Easy walking or mobility work</li></ul>
          <h2>Weekly routine</h2>
          <p>Use at least one lighter day after hard training or matches.</p>
          <h2>Common mistakes</h2>
          <ul><li>Training hard every day</li><li>Ignoring soreness</li><li>Not eating enough after matches</li></ul>
          """,
              "training": f"""
          <h2>Training overview</h2>
          <p>{kw} should be part of a balanced football routine that includes technique, fitness and recovery.</p>
          <h2>Simple session structure</h2>
          <ul><li>Warm-up</li><li>Main drill block</li><li>Conditioning or strength</li><li>Cool-down</li></ul>
          <h2>Weekly plan</h2>
          <p>Start with 2 to 3 focused sessions per week and increase gradually.</p>
          """
          }

          body = templates[c]

          all_posts = sorted([p for p in posts.glob("*.html") if p.name != "index.html"])
          related = [p for p in all_posts if p.name != file.name][:5]

          related_html = ""
          if related:
              related_html = "<h2>Related articles</h2><ul>" + "".join(
                  f'<li><a href="{p.name}">{html.escape(p.stem.replace("-", " "))}</a></li>' for p in related
              ) + "</ul>"

          article = f"""<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>{kw} | Football Fitness Training</title>
            <meta name="description" content="Practical football guide about {kw}.">
            <link rel="stylesheet" href="../style.css">
          </head>
          <body>
            <header>
              <p><a href="../index.html">← Home</a> · <a href="index.html">All articles</a></p>
            </header>
            <main>
              <article>
                <h1>{kw}</h1>
                <p>This guide explains <strong>{kw}</strong> for football players who want practical, simple and useful advice.</p>
                {body}
                <h2>FAQ</h2>
                <h3>How often should football players work on this?</h3>
                <p>Most players should start with 1 to 3 focused sessions per week depending on match schedule and recovery.</p>
                <h3>Is this suitable for beginners?</h3>
                <p>Yes, but beginners should start slowly and focus on technique first.</p>
                {related_html}
                <p class="disclosure">This site may earn a commission from qualifying purchases through some links.</p>
              </article>
            </main>
          </body>
          </html>"""

          file.write_text(article)

          post_files = sorted([p for p in posts.glob("*.html") if p.name != "index.html"])
          latest = sorted(post_files, key=lambda p: p.stat().st_mtime, reverse=True)[:10]

          posts_index = '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Football Training Articles</title><link rel="stylesheet" href="../style.css"></head><body><h1>Football Training Articles</h1><p><a href="../index.html">← Home</a></p><ul class="article-list">'
          for p in post_files:
              posts_index += f'<li><a href="{p.name}">{html.escape(p.stem.replace("-", " "))}</a></li>'
          posts_index += "</ul></body></html>"
          (posts / "index.html").write_text(posts_index)

          home = '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Football Fitness Training</title><meta name="description" content="Football training, recovery, nutrition and equipment guides."><link rel="stylesheet" href="style.css"></head><body><header><h1>Football Fitness Training</h1><p>Improve your football performance with practical guides about speed, strength, recovery, nutrition and equipment.</p></header><main><h2>Latest articles</h2><ul class="article-list">'
          for p in latest:
              home += f'<li><a href="posts/{p.name}">{html.escape(p.stem.replace("-", " "))}</a></li>'
          home += '</ul><p><a href="posts/index.html">View all articles</a></p><p class="disclosure">This site may earn a commission from qualifying purchases through some links.</p></main></body></html>'
          Path("index.html").write_text(home)

          sitemap = '<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n'
          sitemap += f'  <url><loc>{SITE}/</loc></url>\n'
          sitemap += f'  <url><loc>{SITE}/posts/index.html</loc></url>\n'
          for p in post_files:
              sitemap += f'  <url><loc>{SITE}/posts/{p.name}</loc></url>\n'
          sitemap += '</urlset>\n'
          Path("sitemap.xml").write_text(sitemap)
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts index.html sitemap.xml style.css
          git commit -m "Create better football article and update site" || exit 0
          git push
