name: Auto Football Site

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * 1,4"

permissions:
  contents: write

concurrency:
  group: auto-football-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip openai

      - name: Generate site
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/generate.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts pages index.html sitemap.xml sitemap-v2.xml robots.txt style.css favicon.ico scripts templates content_plan.csv
          git commit -m "Generate AI football article and update site" || echo "No changes to commit"
          git push
